# Godot Web shell — COOP/COEP obrigatórios (thread_support=true usa
# SharedArrayBuffer; sem esses headers o browser bloqueia o boot).
# NOTA nginx: add_header não herda entre blocos — repetido em cada location.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 9;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/wasm application/javascript application/json
               application/octet-stream image/png image/svg+xml text/html text/plain;

    # index.html e workers: nunca cachear agressivo (deploys novos)
    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(service\.worker|audio\.position\.worklet|audio\.worklet)\.js$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "no-cache";
    }

    # Assets imutáveis de build (wasm/pck/js/imagens): cache longo.
    location ~* \.(pck|wasm|js|png|svg|json|manifest)$ {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
